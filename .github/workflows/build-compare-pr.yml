name: Compare build times on PR (cache vs no cache)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  cache-enabled:
    name: Build with cache
    runs-on: ubuntu-latest
    env:
      APP_BASE_PATH: ${{ github.workspace }}/src
    defaults:
      run:
        working-directory: src
    outputs:
      composer_sec: ${{ steps.times.outputs.composer_sec }}
      npmci_sec:    ${{ steps.times.outputs.npmci_sec }}
      build_sec:    ${{ steps.times.outputs.build_sec }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            src/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer deps
        id: composer
        run: |
          start=$(date +%s)
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          end=$(date +%s)
          echo "elapsed=$((end-start))" >> $GITHUB_OUTPUT

      - name: Prepare Laravel (no DB)
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
          php artisan key:generate

          mkdir -p storage/framework/{cache/data,sessions,testing,views} storage/logs bootstrap/cache
          chmod -R 775 storage bootstrap/cache || true

          php artisan config:cache
          php artisan route:cache

          if [ -d resources/views ] && find resources/views -type f -name '*.blade.php' | grep -q . ; then
            php artisan view:cache
          else
            echo "Skip view:cache (no views found)"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('src/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: npm ci
        id: npmci
        run: |
          start=$(date +%s)
          npm ci
          end=$(date +%s)
          echo "elapsed=$((end-start))" >> $GITHUB_OUTPUT

      - name: Build frontend (Vite)
        id: build
        run: |
          start=$(date +%s)
          npm run build
          end=$(date +%s)
          echo "elapsed=$((end-start))" >> $GITHUB_OUTPUT

      - name: Collect times
        id: times
        run: |
          echo "composer_sec=${{ steps.composer.outputs.elapsed }}" >> $GITHUB_OUTPUT
          echo "npmci_sec=${{ steps.npmci.outputs.elapsed }}"     >> $GITHUB_OUTPUT
          echo "build_sec=${{ steps.build.outputs.elapsed }}"     >> $GITHUB_OUTPUT

  cache-disabled:
    name: Build without cache
    runs-on: ubuntu-latest
    env:
      APP_BASE_PATH: ${{ github.workspace }}/src
    defaults:
      run:
        working-directory: src
    outputs:
      composer_sec: ${{ steps.times.outputs.composer_sec }}
      npmci_sec:    ${{ steps.times.outputs.npmci_sec }}
      build_sec:    ${{ steps.times.outputs.build_sec }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip
          coverage: none

      - name: Install Composer deps
        id: composer
        run: |
          start=$(date +%s)
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          end=$(date +%s)
          echo "elapsed=$((end-start))" >> $GITHUB_OUTPUT

      - name: Prepare Laravel (no DB)
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
          php artisan key:generate

          mkdir -p storage/framework/{cache/data,sessions,testing,views} storage/logs bootstrap/cache
          chmod -R 775 storage bootstrap/cache || true

          php artisan config:cache
          php artisan route:cache
          if [ -d resources/views ] && find resources/views -type f -name '*.blade.php' | grep -q . ; then
            php artisan view:cache
          else
            echo "Skip view:cache (no views found)"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm ci
        id: npmci
        run: |
          start=$(date +%s)
          npm ci
          end=$(date +%s)
          echo "elapsed=$((end-start))" >> $GITHUB_OUTPUT

      - name: Build frontend (Vite)
        id: build
        run: |
          start=$(date +%s)
          npm run build
          end=$(date +%s)
          echo "elapsed=$((end-start))" >> $GITHUB_OUTPUT

      - name: Collect times
        id: times
        run: |
          echo "composer_sec=${{ steps.composer.outputs.elapsed }}" >> $GITHUB_OUTPUT
          echo "npmci_sec=${{ steps.npmci.outputs.elapsed }}"     >> $GITHUB_OUTPUT
          echo "build_sec=${{ steps.build.outputs.elapsed }}"     >> $GITHUB_OUTPUT

  comment-on-pr:
    name: Comment result on PR
    needs: [cache-enabled, cache-disabled]
    runs-on: ubuntu-latest
    steps:
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const ce = {
              composer: Number("${{ needs['cache-enabled'].outputs.composer_sec }}"),
              npmci:    Number("${{ needs['cache-enabled'].outputs.npmci_sec }}"),
              build:    Number("${{ needs['cache-enabled'].outputs.build_sec }}"),
            };
            const cd = {
              composer: Number("${{ needs['cache-disabled'].outputs.composer_sec }}"),
              npmci:    Number("${{ needs['cache-disabled'].outputs.npmci_sec }}"),
              build:    Number("${{ needs['cache-disabled'].outputs.build_sec }}"),
            };
            const fmt = s => `${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s`;
            const body =
              `### ⏱ Build time comparison (working-directory: \`src\`)\n` +
              `| Step        | With cache | No cache |\n` +
              `|-------------|-----------:|---------:|\n` +
              `| Composer    | ${fmt(ce.composer)} | ${fmt(cd.composer)} |\n` +
              `| npm ci      | ${fmt(ce.npmci)}    | ${fmt(cd.npmci)}    |\n` +
              `| Vite build  | ${fmt(ce.build)}    | ${fmt(cd.build)}    |\n` +
              `\n` +
              `**Total**: With cache = ${fmt(ce.composer+ce.npmci+ce.build)}, ` +
              `No cache = ${fmt(cd.composer+cd.npmci+cd.build)}\n`;

            const number = context.payload.pull_request.number; // 再宣言せずに既存の context を利用
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body
            });
