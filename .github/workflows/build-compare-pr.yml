name: Compare build times on PR (cache vs no cache, with dummy pages)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

env:
  # ダミーページの生成数（大きくするとビルドが重くなります）
  DUMMY_PAGES: "300"

jobs:
  cache-enabled:
    name: Build with cache
    runs-on: ubuntu-latest
    env:
      APP_BASE_PATH: ${{ github.workspace }}/src
    defaults:
      run:
        working-directory: src
    outputs:
      composer_sec: ${{ steps.times.outputs.composer_sec }}
      npmci_sec:    ${{ steps.times.outputs.npmci_sec }}
      build_sec:    ${{ steps.times.outputs.build_sec }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            src/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('src/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer deps
        id: composer
        run: |
          start=$(date +%s)
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          end=$(date +%s)
          echo "elapsed=$((end-start))" >> $GITHUB_OUTPUT

      - name: Prepare Laravel (no DB)
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
          php artisan key:generate
          mkdir -p storage/framework/{cache/data,sessions,testing,views} storage/logs bootstrap/cache
          chmod -R 775 storage bootstrap/cache || true
          php artisan config:cache
          php artisan route:cache
          if [ -d resources/views ] && find resources/views -type f -name '*.blade.php' | grep -q . ; then
            php artisan view:cache
          else
            echo "Skip view:cache (no views found)"
          fi

      # ダミーページを大量生成（YAML安全のため echo で出力）
      - name: Generate dummy Vue pages (${{ env.DUMMY_PAGES }})
        run: |
          set -eu
          mkdir -p resources/js/Pages/Dummy
          for i in $(seq 1 ${DUMMY_PAGES}); do
            f="resources/js/Pages/Dummy/Page${i}.vue"
            echo "<template>" > "$f"
            echo "  <div class=\"min-h-[80px] p-4 bg-white shadow rounded border border-gray-200\">" >> "$f"
            echo "    <h2 class=\"text-lg font-semibold mb-2\">Dummy Page ${i}</h2>" >> "$f"
            echo "    <div class=\"grid grid-cols-3 gap-2\">" >> "$f"
            echo "      <div class=\"h-6 bg-gray-100 rounded\"></div>" >> "$f"
            echo "      <div class=\"h-6 bg-gray-100 rounded\"></div>" >> "$f"
            echo "      <div class=\"h-6 bg-gray-100 rounded\"></div>" >> "$f"
            echo "    </div>" >> "$f"
            echo "    <div class=\"mt-3 space-x-2\">" >> "$f"
            echo "      <span class=\"inline-block px-2 py-1 text-xs rounded bg-blue-50 text-blue-700\">badge</span>" >> "$f"
            echo "      <span class=\"inline-block px-2 py-1 text-xs rounded bg-emerald-50 text-emerald-700\">badge</span>" >> "$f"
            echo "      <span class=\"inline-block px-2 py-1 text-xs rounded bg-amber-50 text-amber-700\">badge</span>" >> "$f"
            echo "    </div>" >> "$f"
            echo "  </div>" >> "$f"
            echo "</template>" >> "$f"
            echo "<script setup>" >> "$f"
            echo "/* noop */" >> "$f"
            echo "</script>" >> "$f"
          done
          echo "Generated ${DUMMY_PAGES} dummy pages under resources/js/Pages/Dummy/"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('src/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: npm ci
        id: npmci
        run: |
          start=$(date +%s)
          npm ci
          end=$(date +%s)
          echo "elapsed=$((end-start))" >> $GITHUB_OUTPUT

      - name: Build frontend (Vite)
        id: build
        run: |
          start=$(date +%s)
          npm run build
          end=$(date +%s)
          echo "elapsed=$((end-start))" >> $GITHUB_OUTPUT

      - name: Collect times
        id: times
        run: |
          echo "composer_sec=${{ steps.composer.outputs.elapsed }}" >> $GITHUB_OUTPUT
          echo "npmci_sec=${{ steps.npmci.outputs.elapsed }}"     >> $GITHUB_OUTPUT
          echo "build_sec=${{ steps.build.outputs.elapsed }}"     >> $GITHUB_OUTPUT

  cache-disabled:
    name: Build without cache
    runs-on: ubuntu-latest
    env:
      APP_BASE_PATH: ${{ github.workspace }}/src
    defaults:
      run:
        working-directory: src
    outputs:
      composer_sec: ${{ steps.times.outputs.composer_sec }}
      npmci_sec:    ${{ steps.times.outputs.npmci_sec }}
      build_sec:    ${{ steps.times.outputs.build_sec }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip
          coverage: none

      - name: Install Composer deps
        id: composer
        run: |
          start=$(date +%s)
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          end=$(date +%s)
          echo "elapsed=$((end-start))" >> $GITHUB_OUTPUT

      - name: Prepare Laravel (no DB)
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
          php artisan key:generate
          mkdir -p storage/framework/{cache/data,sessions,testing,views} storage/logs bootstrap/cache
          chmod -R 775 storage bootstrap/cache || true
          php artisan config:cache
          php artisan route:cache
          if [ -d resources/views ] && find resources/views -type f -name '*.blade.php' | grep -q . ; then
            php artisan view:cache
          else
            echo "Skip view:cache (no views found)"
          fi

      # 同じ数のダミーページを生成（公平）
      - name: Generate dummy Vue pages (${{ env.DUMMY_PAGES }})
        run: |
          set -eu
          mkdir -p resources/js/Pages/Dummy
          for i in $(seq 1 ${DUMMY_PAGES}); do
            f="resources/js/Pages/Dummy/Page${i}.vue"
            echo "<template>" > "$f"
            echo "  <div class=\"min-h-[80px] p-4 bg-white shadow rounded border border-gray-200\">" >> "$f"
            echo "    <h2 class=\"text-lg font-semibold mb-2\">Dummy Page ${i}</h2>" >> "$f"
            echo "    <div class=\"grid grid-cols-3 gap-2\">" >> "$f"
            echo "      <div class=\"h-6 bg-gray-100 rounded\"></div>" >> "$f"
            echo "      <div class=\"h-6 bg-gray-100 rounded\"></div>" >> "$f"
            echo "      <div class=\"h-6 bg-gray-100 rounded\"></div>" >> "$f"
            echo "    </div>" >> "$f"
            echo "    <div class=\"mt-3 space-x-2\">" >> "$f"
            echo "      <span class=\"inline-block px-2 py-1 text-xs rounded bg-blue-50 text-blue-700\">badge</span>" >> "$f"
            echo "      <span class=\"inline-block px-2 py-1 text-xs rounded bg-emerald-50 text-emerald-700\">badge</span>" >> "$f"
            echo "      <span class=\"inline-block px-2 py-1 text-xs rounded bg-amber-50 text-amber-700\">badge</span>" >> "$f"
            echo "    </div>" >> "$f"
            echo "  </div>" >> "$f"
            echo "</template>" >> "$f"
            echo "<script setup>" >> "$f"
            echo "/* noop */" >> "$f"
            echo "</script>" >> "$f"
          done
          echo "Generated ${DUMMY_PAGES} dummy pages under resources/js/Pages/Dummy/"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No cache 側は npm のキャッシュと node_modules を完全削除して差を出す
      - name: Purge npm caches (no-cache job)
        run: |
          npm cache clean --force || true
          rm -rf ~/.npm || true
          rm -rf node_modules || true

      - name: npm ci
        id: npmci
        run: |
          start=$(date +%s)
          npm ci
          end=$(date +%s)
          echo "elapsed=$((end-start))" >> $GITHUB_OUTPUT

      - name: Build frontend (Vite)
        id: build
        run: |
          start=$(date +%s)
          npm run build
          end=$(date +%s)
          echo "elapsed=$((end-start))" >> $GITHUB_OUTPUT

      - name: Collect times
        id: times
        run: |
          echo "composer_sec=${{ steps.composer.outputs.elapsed }}" >> $GITHUB_OUTPUT
          echo "npmci_sec=${{ steps.npmci.outputs.elapsed }}"     >> $GITHUB_OUTPUT
          echo "build_sec=${{ steps.build.outputs.elapsed }}"     >> $GITHUB_OUTPUT

  comment-on-pr:
    name: Comment result on PR
    needs: [cache-enabled, cache-disabled]
    runs-on: ubuntu-latest
    steps:
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const ce = {
              composer: Number("${{ needs['cache-enabled'].outputs.composer_sec }}"),
              npmci:    Number("${{ needs['cache-enabled'].outputs.npmci_sec }}"),
              build:    Number("${{ needs['cache-enabled'].outputs.build_sec }}"),
            };
            const cd = {
              composer: Number("${{ needs['cache-disabled'].outputs.composer_sec }}"),
              npmci:    Number("${{ needs['cache-disabled'].outputs.npmci_sec }}"),
              build:    Number("${{ needs['cache-disabled'].outputs.build_sec }}"),
            };
            const fmt = s => `${Math.floor(s/60)}m ${String(s%60).padStart(2,'0')}s`;
            const body =
              `### ⏱ Build time comparison (with ${process.env.DUMMY_PAGES || '300'} dummy pages; cwd: \`src\`)\n` +
              `| Step        | With cache | No cache |\n` +
              `|-------------|-----------:|---------:|\n` +
              `| Composer    | ${fmt(ce.composer)} | ${fmt(cd.composer)} |\n` +
              `| npm ci      | ${fmt(ce.npmci)}    | ${fmt(cd.npmci)}    |\n` +
              `| Vite build  | ${fmt(ce.build)}    | ${fmt(cd.build)}    |\n` +
              `\n` +
              `**Total**: With cache = ${fmt(ce.composer+ce.npmci+ce.build)}, ` +
              `No cache = ${fmt(cd.composer+cd.npmci+cd.build)}\n` +
              `\n` +
              `> Note: Dummy pages are generated under \`resources/js/Pages/Dummy/\` in both jobs to increase Tailwind scan & build workload.`;

            const number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body
            });
